# Profile README only: no code, no package manifest and no CI, so the gate is file hygiene,
# a link check on the profile pages and Conventional Commits. No detect-secrets: nothing
# here can hold a credential beyond what detect-private-key already catches.
#
# Measured 2026-10-23, /usr/bin/time -p:
#   pre-commit run --all-files                          0.4-1.3 s
#   pre-commit run --hook-stage pre-push --all-files    0.8-2.6 s  (lychee, network-bound)
# Before: no hooks and no CI.
default_install_hook_types: [pre-commit, pre-push, commit-msg]
# pre-commit-hooks' manifest also lists pre-push for some hooks, which default_stages does not
# override, so every hook sets stages explicitly.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]

  - repo: local
    hooks:
      # Every card and link on the profile must return its page (AGENTS.md). Needs `brew install lychee`.
      # README.md only: COMPONENTS.md cites known-dead URLs (qedpi.com, /cv) as evidence on purpose.
      # 429 is accepted: the stats host rate-limits repeat requests. A 5xx still fails the push.
      - id: lychee
        name: Check profile links
        entry: lychee --no-progress --accept 200..=299,429
        language: system
        files: ^README\.md$
        stages: [pre-push]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.2
    hooks:
      - id: commitizen
        stages: [commit-msg]

exclude: ^\.git/(?!COMMIT_EDITMSG$)
